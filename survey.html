function shuffleArray(array) {
   var a=[];
   var b=[]
   while(array.length>0) {
	var j = Math.floor(Math.random() * array.length);
	var obj = array[j];
	array.splice(j,1);
	if("private" in obj && obj.private==true) {
		b.push(obj);
		}
	else	{
		a.push(obj);
		}
	}
  for(var i in b) {
	a.push(b[i]);
	} 
  return a;
  }

function isURL(u) {
	return u.indexOf("http://")==0 || u.indexOf("https://")==0;
	}

function toNode(E) {
	var s = E.url.replace(/[~]/g,"");
	var ig_base = "https://www.instagram.com/";
	url = s;
	var suffix = ("suffix" in E?E.suffix:"");
	var css = ("css" in E?E.css:"");
	if("deleted" in E && E.deleted) return null;
	if("proba" in E) {
		var proba = parseFloat(E.proba);
		if(Math.random() >= proba) return null;
		}
	if("telegram" in E && E.telegram) {
		if(!isURL(url)) url = "https://t.me/s/"+s;
		}
	else if("flickr" in E && E.flickr) {
		if(is_galaxy) return null;
		if(!isURL(url)) url = "https://www.flickr.com/photos/"+s;
		var x2="f";
		if("pages" in E) {
			if(!url.endsWith("/")) url+="/";
			url+="page"+ (1+Math.floor(Math.random() * (parseInt(E.pages)-1)));
			x2 += "r";
			}
		if(url.indexOf("/groups/")!=-1) x2+="g";
		suffix+="["+x2+"]";
		css+=" flickr";
		}
	else if("500px" in E && E["500px"]==true) {
		if(is_galaxy) return null;
		if(!isURL(url)) url = "https://500px.com/p/"+s+"?view=photos";
		css="px500";
		}
	else if("da" in E  && E.da) {
		if(is_galaxy) return null;
		if(!isURL(url)) url = "https://www.deviantart.com/"+s+"/gallery/all";
		}
	else if("reddit" in E && E.reddit==true) {
		if(is_galaxy) return null;
		if(!isURL(url)) url = "https://www.reddit.com/"+s+"/submitted/";
		css="reddit";
		}
	else if(!isURL(url)) {
		url = isURL(s)?s:ig_base + s;
		if("tagged" in E && E.tagged && Math.random() > 0.5) url=url+"/tagged";
		}

	if(is_galaxy) { 
		if( url.indexOf(ig_base)==0 && url.substring(ig_base.length).indexOf('/')==-1) {
			url =  "instagram://user?username=" + url.substring(ig_base.length);
			}
		}
	var title = s;
	var text = s;
	if("text" in E) text=E.text.replace(/[~]/g,"");
	text+= suffix;
	if("title" in E) title=E.title.replace(/[~]/g,"");

	var li = document.createElement("li");
	var a = document.createElement("a");
	li.appendChild(a);
	if("private" in E && E["private"]) css+= "private";
	if(css.length>0) a.setAttribute("class",css);
	a.appendChild(document.createTextNode(text));
	a.setAttribute("target","_blank");
	a.setAttribute("href",url);
	a.setAttribute("title",title);
	if(s.length==0) return;
	return li;
	}
